<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Klosseland</title>
</head>
<body>

  <!-- Loading overlay — hidden until a world is selected -->
  <div id="loading-screen" style="display:none">
    <div id="loading-logo">Klosseland</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-text">Loading…</div>
  </div>

  <!-- Three.js renders here -->
  <canvas id="game-canvas"></canvas>

  <!-- All HTML UI panels mount here -->
  <div id="ui-root"></div>

  <!-- Underwater tint overlay (Phase 15.3) -->
  <div id="water-overlay" style="
    display:none;
    position:fixed; inset:0;
    background:rgba(10,40,100,0.35);
    pointer-events:none;
    z-index:5;
  "></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
